# Pick-and-place task settings. All positions are in the robot's "world"
# frame (origin at the base of the robot body, x forward, y left, z up).
# Gripper settings live in a separate file (gripper_openarm_pinch.yaml).

pick_place:
  ros__parameters:
    # Where the cup's pose comes from: any node publishing a PoseStamped on
    # this topic (base centre of the cup, x axis towards the handle).
    # In simulation: cup_perception/gazebo_cup_pose (ground truth).
    cup_pose_topic: /cup_pose
    # The pose used for the grasp: median of this many new estimates (smooths
    # out camera noise; a ground-truth source just repeats the same pose).
    cup_pose_samples: 5
    # Can the pose source still see the cup while the hand holds it? Ground
    # truth can; the camera estimator cannot (its self-filter removes a held
    # cup together with the hand). false: the in-hand tilt checks and the slip
    # correction are skipped with a warning, the grasp is confirmed from the
    # finger width, and the placement from a new estimate after release.
    pose_source_sees_held_cup: true
    # Bool topic saying whether the source actually saw the handle ("" = the
    # source always knows the handle direction, like ground truth). The camera
    # estimator publishes /cup_pose_estimate/handle_visible.
    handle_visible_topic: ""
    # Handle not seen: the estimator assumes it points away from the camera.
    # Stage 4 measured hidden handles at up to ~45 deg from that direction, so
    # a "handle could be here" zone of this many degrees either side goes into
    # the planning scene, and the finger clearance check covers all of it.
    hidden_handle_spread_deg: 45.0
    # true: refuse to grasp a cup whose handle was not seen.
    refuse_hidden_handle: false
    # Cup dimensions. Empty = cup_description/config/cup.yaml.
    cup_config: ""

    planning_frame: world
    home_pose: home          # SRDF named poses used by the task
    lifted_pose: lifted

    # Place spot: cup base centre, ~17 cm to the right of where the cup starts.
    # The cup is put down at the table height it was picked from.
    place_xy: [0.30, -0.32]

    # Grasp: the fingers close on the cup body at this fraction of its height
    # (raised automatically if a finger corner would get closer than
    # table_clearance to the table).
    grasp_height_fraction: 0.5
    table_clearance: 0.008
    # Grasp pitch: how far the fingers point down (0 = from the side, 90 =
    # straight down). The cup stays level either way.
    grasp_pitches_deg: [45.0, 30.0, 60.0, 15.0, 75.0, 0.0, 90.0]
    # The hand may approach from any direction around the cup, in steps of
    # this many degrees. Every heading x pitch combination is tried at the
    # grasp pose and ranked by how far the arm's joints stay from their
    # limits; the most comfortable one whose whole sequence is reachable wins.
    grasp_heading_step_deg: 30.0
    # Planning group used only to find and rank grasps at the cup (same
    # joints as the arm group, different IK solver: cup_moveit_config's
    # right_arm_ik uses pick_ik, a global search). The follow-on poses and
    # straight-line moves use the arm group, starting from the grasp found.
    # "" = use the arm group (KDL) for everything. In testing (5 runs each,
    # noise on) both settings completed 1/5; the cup was grasped and put down
    # in 3/5 with right_arm_ik vs 2/5 with "" (results/pick_place_runs_*.csv).
    grasp_search_group: right_arm_ik
    # Check the whole sequence only for this many of the most comfortable
    # grasps found at the cup (0 = all of them). The sim settings use 20.
    grasp_max_candidates: 0
    # Skip directions where a finger would point within this angle of the
    # handle (or of the "handle could be here" zone): cheap first filter.
    handle_finger_min_angle_deg: 25.0
    # Then MoveIt checks the closed fingers against the handle's collision
    # box: they must stay at least this far (m) from it, for the handle
    # anywhere within visible_handle_margin_deg of the estimate (seen
    # handles: covers the estimate's yaw error) or the whole hidden zone.
    handle_min_clearance: 0.003
    visible_handle_margin_deg: 10.0
    # Pre-grasp: back off this far along the approach direction, and this far up.
    approach_distance: 0.08
    approach_height: 0.04
    # After grasping, lift by this much before carrying; carry at that height.
    lift_height: 0.10
    # Place: release with the cup this far above the table (it drops the rest).
    place_drop: 0.002
    # After releasing: back away along the approach direction, then up.
    retreat_distance: 0.08

    # Speed (fraction of the joint limits) for planned and straight-line moves.
    velocity_scaling: 0.3
    acceleration_scaling: 0.3
    planning_time: 10.0
    # Reject IK solutions this close (rad) to a joint limit: a joint pressed
    # against its end stop cannot follow the next straight-line move.
    ik_joint_limit_margin: 0.05
    # Straight-line moves fail if less than this fraction can be followed.
    min_cartesian_fraction: 0.98
    # Abort if the carried cup tilts more than this (deg).
    max_cup_tilt_deg: 5.0

    # Gripper: "stall" = close until the fingers stall on the cup, then hold
    # grasp_squeeze inside the measured width (a gentle, bounded squeeze).
    # ("width" is a simulation-only shortcut, see pick_place_sim.yaml.)
    # After each gripper command, wait its close_duration plus the settle
    # time below (s).
    gripper_close_mode: stall
    grasp_squeeze: 0.002
    # The fingers must stop on the cup: stopping wider than the cup by more
    # than this means something else (e.g. the handle) is between them.
    max_stall_over_diameter: 0.006
    gripper_settle_time: 1.0
    # After grasping, re-read the cup pose and shift the place moves by how
    # far the cup slid while the fingers closed. Needs a cup pose source that
    # still sees the cup in the hand (Gazebo ground truth does; skipped when
    # pose_source_sees_held_cup is false).
    correct_place_with_cup_pose: true

    # SIMULATION-ONLY shortcut: lock the cup to the hand with a Gazebo
    # detachable joint while it is held (Gazebo's point contacts let a
    # pinched cup pivot ~10 deg). Off here so the real robot never uses it;
    # pick_place.launch.py sim:=true (its default) loads pick_place_sim.yaml
    # on top of this file, which turns it on together with the other
    # simulation-only settings.
    use_sim_attach: false
