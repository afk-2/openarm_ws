# Controllers for OpenArm in Gazebo, loaded by ign_ros2_control's controller
# manager. Controller names match openarm_bringup's
# openarm_bimanual_controllers.yaml so MoveIt configs work unchanged. Differences:
#   - update_rate 500 Hz (physics steps at 1 kHz; 750 Hz would alias)
#   - spline interpolation: the real config streams high-rate commands with
#     interpolation disabled, which is jerky with sparse MoveIt waypoints.
/**/controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/left_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Fail goals the arm can't reach (e.g. blocked by the table) instead of
    # reporting success; the real config disables these checks.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 1.0
      openarm_left_joint1: {trajectory: 0.0, goal: 0.05}
      openarm_left_joint2: {trajectory: 0.0, goal: 0.05}
      openarm_left_joint3: {trajectory: 0.0, goal: 0.05}
      openarm_left_joint4: {trajectory: 0.0, goal: 0.05}
      openarm_left_joint5: {trajectory: 0.0, goal: 0.05}
      openarm_left_joint6: {trajectory: 0.0, goal: 0.05}
      openarm_left_joint7: {trajectory: 0.0, goal: 0.05}

/**/right_joint_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
