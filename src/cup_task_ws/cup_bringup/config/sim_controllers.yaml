      openarm_right_joint2: {trajectory: 0.0, goal: 0.05}
      openarm_right_joint3: {trajectory: 0.0, goal: 0.05}
      openarm_right_joint4: {trajectory: 0.0, goal: 0.05}
      openarm_right_joint5: {trajectory: 0.0, goal: 0.05}
      openarm_right_joint6: {trajectory: 0.0, goal: 0.05}
      openarm_right_joint7: {trajectory: 0.0, goal: 0.05}

